name: Windows CI with Prebuilt Deps

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Cache prebuilt dependencies
      - name: Cache prebuilt deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: prebuilt-deps
          key: prebuilt-deps-v1

      # 2. Download from Release if cache missed
      - name: Download prebuilt deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          echo "Downloading prebuilt deps..."
          curl -L -o deps.zip https://github.com/daberpro/lantern-lib/releases/download/Prebuild-Binaries-For-Lantern/github-actions.zip
          Expand-Archive deps.zip -DestinationPath prebuilt-deps

      # 3. Configure project with prebuilt deps
      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prebuilt-deps/github-actions"

      # 4. Build project
      - name: Build
        run: cmake --build build --config Release --parallel
